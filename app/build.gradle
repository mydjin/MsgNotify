plugins {
    id 'com.android.application'
}

// 签名凭据从 keystore.properties 读取（该文件与 .keystore 均不入库）。
// 文件缺失时自动降级为无自定义签名，构建仍可完成，只是 APK 走默认 debug 签名。
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
def hasKeystore = false
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
    hasKeystore = rootProject.file(keystoreProps['storeFile'] ?: '').exists()
}

android {
    namespace 'com.msgnotify.app'
    compileSdk 35
    buildToolsVersion '36.0.0'

    defaultConfig {
        applicationId "com.msgnotify.app"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    // 固定签名：保证每次构建签名一致，手机可直接覆盖升级
    signingConfigs {
        if (hasKeystore) {
            release {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            if (hasKeystore) signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            if (hasKeystore) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

// 统一 kotlin-stdlib 版本：
// 旧版 kotlin-stdlib-jdk7/jdk8 的类已被合并进 1.8+ 的 kotlin-stdlib，
// 不对齐版本会在 checkReleaseDuplicateClasses 阶段报重复类。
configurations.all {
    resolutionStrategy.force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22',
            'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22',
            'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
}
